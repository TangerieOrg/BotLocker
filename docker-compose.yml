name: botlocker

services:
  bot:
    build: .
    image: botlocker-bot:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - ENV_FILE=/run/secrets/BotLockerEnv
      - DATA_DIR=/data
    volumes:
      - botlocker-data:/data
    secrets:
      - BotLockerEnv

  # Read-only remote-sqlite endpoint for the database, bound to the LAN address only
  db:
    image: botlocker-bot:latest
    pull_policy: never
    restart: unless-stopped
    command: ["run", "-A", "--unstable-ffi", "src/dbserver/main.ts"]
    environment:
      - DATA_DIR=/data
    ports:
      - "192.168.1.171:8081:8080"
    volumes:
      - botlocker-data:/data
    depends_on:
      - bot

volumes:
  botlocker-data:
    external: true
    name: botlocker_botlocker-data

secrets:
  BotLockerEnv:
    file: /home/tangerie/secrets/BotLockerEnv
