name: botlocker

services:
  bot:
    build: .
    image: botlocker-bot:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - ENV_FILE=/run/secrets/BotLockerEnv
      - DATA_DIR=/data
    volumes:
      - botlocker-data:/data
    secrets:
      - BotLockerEnv

volumes:
  botlocker-data:
    external: true
    name: botlocker_botlocker-data

secrets:
  BotLockerEnv:
    file: /home/tangerie/secrets/BotLockerEnv
