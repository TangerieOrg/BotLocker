name: botlocker

services:
  bot:
    build: .
    image: botlocker-bot:latest
    pull_policy: never
    restart: unless-stopped
    environment:
      - ENV_FILE=/run/secrets/BotLockerEnv
      - DATA_DIR=/data
    volumes:
      - botlocker-data:/data
    secrets:
      - BotLockerEnv

  # Read-only remote-sqlite endpoint for the database, behind Traefik, LAN only
  db:
    image: botlocker-bot:latest
    pull_policy: never
    restart: unless-stopped
    command: ["run", "-A", "--unstable-ffi", "src/dbserver/main.ts"]
    environment:
      - DATA_DIR=/data
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.botlocker-db.entrypoints=web"
      - "traefik.http.routers.botlocker-db.rule=Path(`/botlocker-db`) || PathPrefix(`/botlocker-db/`)"
      - "traefik.http.routers.botlocker-db.middlewares=lan-only@file,stripprefix-botlocker-db"
      - "traefik.http.middlewares.stripprefix-botlocker-db.stripprefix.prefixes=/botlocker-db"
      - "traefik.http.services.botlocker-db.loadbalancer.server.port=8080"
    volumes:
      - botlocker-data:/data
    depends_on:
      - bot

networks:
  traefik-proxy:
    external: true

volumes:
  botlocker-data:
    external: true
    name: botlocker_botlocker-data

secrets:
  BotLockerEnv:
    file: /home/tangerie/secrets/BotLockerEnv
